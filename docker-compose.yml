version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:5000
      MONGODB_URI: mongodb://mongo:27017/complaint_system
      DB_NAME: complaint_system
    env_file:
      - backend/.env

volumes:
  mongo_data:
